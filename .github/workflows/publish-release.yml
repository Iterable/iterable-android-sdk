name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 3.6.0)'
        required: true
        type: string

env:
  VERSION: ${{ github.event.inputs.version }}

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.ITERABLE_SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.ITERABLE_SDK_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify release is ready
        id: verify_changelog
        run: |
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for [$VERSION]. Merge the prepare-release PR to master before running this workflow."
            exit 1
          fi

      - name: Ensure GitHub release exists
        id: release_state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh release view "$VERSION" &>/dev/null; then
            echo "::error::No GitHub release found for $VERSION. Run Prepare Release before publishing."
            exit 1
          fi
          is_draft=$(gh release view "$VERSION" --json isDraft -q .isDraft)
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          if [ "$is_draft" = "true" ]; then
            echo "Release $VERSION is a draft; will publish on GitHub before Maven Central."
          else
            echo "Release $VERSION is already published; retrying tag alignment and Maven Central upload."
          fi

      - name: Publish draft GitHub release
        if: steps.release_state.outputs.is_draft == 'true'
        id: publish_github
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          target="$(git rev-parse HEAD)"
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" \
              --draft=false \
              --target "$target" \
              --prerelease
          else
            gh release edit "$VERSION" \
              --draft=false \
              --target "$target" \
              --latest
          fi

      - name: Point release tag at master HEAD
        id: align_tag
        run: |
          target="$(git rev-parse HEAD)"
          # gh release edit does not move an existing tag; align tag to the merged release commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION" "$target"
          git push origin "refs/tags/$VERSION" --force

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Import GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --export-secret-keys > ~/.gnupg/secring.gpg
          GPG_KEY_ID="${{ secrets.GPG_KEY_ID }}"
          echo "SHORT_GPG_KEY_ID=${GPG_KEY_ID: -8}" >> $GITHUB_ENV

      - name: Publish to Sonatype Central
        id: central
        run: ./gradlew clean :iterableapi:assemble :iterableapi-ui:assemble publishAllPublicationsToCentralPortal
        env:
          ORG_GRADLE_PROJECT_SIGNING_KEY_ID: ${{ env.SHORT_GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_SIGNING_SECRET_KEY_RING_FILE: /home/runner/.gnupg/secring.gpg
          ORG_GRADLE_PROJECT_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Slack notification
        if: steps.central.outcome == 'success'
        continue-on-error: true
        run: |
          release_url="https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          payload=$(jq -n \
            --arg text ":android: *Android SDK ${VERSION}* has been released. <${release_url}|View release notes>." \
            '{"text": $text}')
          curl -sS -f -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_WEBHOOK }}"

      - name: Slack failure notification
        if: failure() && steps.central.outcome != 'success'
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
          payload=$(jq -n \
            --arg text ":alert: Android SDK release ${VERSION} failed (attempt ${{ github.run_attempt }}). Run: ${run_url}" \
            '{"text": $text}')
          curl -sS -f -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_WEBHOOK }}"
